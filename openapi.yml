openapi: 3.0.0
paths:
  /health:
    get:
      operationId: HealthController_check
      parameters: []
      responses:
        '200':
          description: The Health Check is successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  info:
                    type: object
                    example:
                      database:
                        status: up
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  error:
                    type: object
                    example: {}
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example:
                      database:
                        status: up
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
        '503':
          description: The Health Check is not successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  info:
                    type: object
                    example:
                      database:
                        status: up
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  error:
                    type: object
                    example:
                      redis:
                        status: down
                        message: Could not connect
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
                    nullable: true
                  details:
                    type: object
                    example:
                      database:
                        status: up
                      redis:
                        status: down
                        message: Could not connect
                    additionalProperties:
                      type: object
                      required:
                        - status
                      properties:
                        status:
                          type: string
                      additionalProperties: true
      tags:
        - Health
  /users:
    post:
      description: >-
        Creates a new staff account. Password is bcrypt-hashed before storage.
        Returns no password_hash.
      operationId: UsersController_create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDto'
        '409':
          description: Username already taken
      security:
        - bearer: []
      summary: Create a user account (Admin only)
      tags:
        - Users
    get:
      description: >-
        Paginated user list. Filter by role=Nurse, role=Head_Nurse, or
        role=Admin.
      operationId: UsersController_findAll
      parameters:
        - name: page
          required: false
          in: query
          schema:
            example: 1
            type: number
        - name: limit
          required: false
          in: query
          schema:
            example: 10
            type: number
        - name: role
          required: false
          in: query
          schema:
            example: Nurse
            type: string
            enum:
              - Admin
              - Head_Nurse
              - Nurse
              - Patient
        - name: isActive
          required: false
          in: query
          schema:
            example: true
            type: boolean
        - name: search
          required: false
          in: query
          description: Search by full_name (partial match)
          schema:
            example: Hoa
            type: string
        - name: userId
          required: false
          in: query
          description: Filter by exact user_id
          schema:
            example: 3
            type: number
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: List users
      tags:
        - Users
  /users/{id}:
    get:
      operationId: UsersController_findOne
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDto'
        '404':
          description: User not found
      security:
        - bearer: []
      summary: Get user by id
      tags:
        - Users
    patch:
      description: >-
        Update full_name, role, status, or password. New password is re-hashed
        automatically.
      operationId: UsersController_update
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDto'
      security:
        - bearer: []
      summary: Update user info
      tags:
        - Users
    delete:
      description: >-
        Sets status = Inactive. Does not hard delete — id is referenced by
        alerts.handled_by.
      operationId: UsersController_deactivate
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponseDto'
      security:
        - bearer: []
      summary: Deactivate user (soft delete)
      tags:
        - Users
  /auth/login:
    post:
      operationId: AuthController_login
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '201':
          description: ''
      summary: Login with username and password, returns JWT
      tags:
        - Auth
  /auth/refresh:
    post:
      operationId: AuthController_refresh
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshDto'
      responses:
        '201':
          description: ''
      summary: Exchange a refresh token for a new access token
      tags:
        - Auth
  /auth/logout:
    post:
      operationId: AuthController_logout
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshDto'
      responses:
        '201':
          description: ''
      summary: Revoke a refresh token
      tags:
        - Auth
  /auth/me:
    get:
      operationId: AuthController_me
      parameters: []
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: Get current user profile
      tags:
        - Auth
  /nurses/stats:
    get:
      operationId: NurseController_getStats
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NurseStatsDto'
      security:
        - bearer: []
      summary: Get nurse count stats (total, active, inactive)
      tags:
        - Nurses
  /nurses:
    get:
      operationId: NurseController_getNurses
      parameters:
        - name: page
          required: false
          in: query
          schema:
            example: 1
            type: number
        - name: limit
          required: false
          in: query
          schema:
            example: 10
            type: number
        - name: userId
          required: false
          in: query
          description: Filter by exact user_id
          schema:
            example: 3
            type: number
        - name: isActive
          required: false
          in: query
          description: Filter by active status
          schema:
            example: true
            type: boolean
        - name: search
          required: false
          in: query
          description: Search by full_name (partial match)
          schema:
            example: Hoa
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNursesDto'
      security:
        - bearer: []
      summary: Get nurse list with pagination, search and isActive filter
      tags:
        - Nurses
    post:
      operationId: NurseController_createNurse
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNurseDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NurseResponseDto'
      security:
        - bearer: []
      summary: Create a new nurse account
      tags:
        - Nurses
  /nurses/{id}:
    get:
      operationId: NurseController_getNurseById
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NurseResponseDto'
        '404':
          description: Nurse not found
      security:
        - bearer: []
      summary: Get nurse by ID
      tags:
        - Nurses
    patch:
      operationId: NurseController_updateNurse
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNurseDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NurseResponseDto'
        '404':
          description: Nurse not found
      security:
        - bearer: []
      summary: Update nurse info
      tags:
        - Nurses
    delete:
      operationId: NurseController_deleteNurse
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NurseResponseDto'
        '404':
          description: Nurse not found
      security:
        - bearer: []
      summary: Soft delete nurse (deactivate)
      tags:
        - Nurses
  /patients:
    get:
      description: >-
        Paginated patient list. Supports search by case_id/full name, filter by
        level and operation type, and sort by POD. Default ordering: level
        (Red→Yellow→Green) then oldest case to the newest.
      operationId: PatientController_getAllPatients
      parameters:
        - name: search
          required: false
          in: query
          description: >-
            Search by case ID or patient full name (case-insensitive, partial
            match)
          schema:
            example: CASE-001
            type: string
        - name: level
          required: false
          in: query
          description: Filter by care/risk level
          schema:
            example: Red
            type: string
            enum:
              - Red
              - Yellow
              - Green
        - name: operationTypeId
          required: false
          in: query
          description: Filter by operation type id
          schema:
            example: 2
            type: number
        - name: sortBy
          required: false
          in: query
          description: >-
            Column to sort by. When omitted, defaults to level
            (Red→Yellow→Green) then oldest case first.
          schema:
            example: pod
            type: string
            enum:
              - pod
        - name: sortOrder
          required: false
          in: query
          description: Sort direction (only applies when sortBy is set). Default ASC.
          schema:
            example: ASC
            type: string
            enum:
              - ASC
              - DESC
        - name: page
          required: false
          in: query
          description: 'Page number (default: 1)'
          schema:
            example: 1
            type: number
        - name: limit
          required: false
          in: query
          description: 'Items per page (default: 10)'
          schema:
            example: 10
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPatientsDto'
      security:
        - bearer: []
      summary: Get the priority patient list
      tags:
        - Patients
    post:
      description: >-
        Creates the patient_cases row and the linked Patient-role users account
        atomically. If username/password are omitted, the username defaults to
        the case id and the password to a system default.
      operationId: PatientController_createPatient
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePatientDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientListItemDto'
        '400':
          description: Invalid operation type or assigned nurse
        '409':
          description: Case id or username already exists
      security:
        - bearer: []
      summary: Create a patient (case + linked login account)
      tags:
        - Patients
  /patients/operation-types:
    get:
      description: Options for the surgery-type dropdown on the create/edit patient form.
      operationId: PatientController_getOperationTypes
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OperationTypeDto'
      security:
        - bearer: []
      summary: List operation types
      tags:
        - Patients
  /patients/{id}/current-pod:
    get:
      operationId: PatientController_getCurrentPod
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentPodResponseDto'
        '404':
          description: Patient not found
      security:
        - bearer: []
      summary: Get current POD day for a patient
      tags:
        - Patients
  /patients/{id}/assessments:
    get:
      operationId: PatientController_getAssessmentHistory
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: limit
          required: false
          in: query
          schema:
            example: 10
        - name: page
          required: false
          in: query
          schema:
            example: 1
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssessmentHistoryDto'
        '404':
          description: Patient not found
      security:
        - bearer: []
      summary: Get assessment history for a patient (Nurse/Head Nurse only)
      tags:
        - Patients
  /patients/{id}/start-eras:
    post:
      operationId: PatientController_startEras
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
        '400':
          description: ERAS already started
        '404':
          description: Patient not found
      security:
        - bearer: []
      summary: Start ERAS protocol for a patient (Head Nurse only)
      tags:
        - Patients
  /patients/{id}/pod-lock:
    patch:
      description: >-
        Nurse/Head Nurse only. When locking, holdReason is required. Emits
        real-time WebSocket event pod.locked / pod.unlocked to /patients
        namespace.
      operationId: PatientController_lockPod
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PodLockDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PodLockResponseDto'
        '400':
          description: No active POD or holdReason missing
        '404':
          description: Patient not found
      security:
        - bearer: []
      summary: Lock or unlock POD progression for a patient
      tags:
        - Patients
  /patients/{id}/pod-level:
    patch:
      description: >-
        Nurse/Head Nurse only. Allows rolling back to a previous POD level. The
        new podLevel must be >= 0 and < current_pod (only backward movement
        allowed).
      operationId: PatientController_updatePodLevel
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePodLevelDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientListItemDto'
        '400':
          description: 'Invalid POD level: must be >= 0 and < current_pod'
        '404':
          description: Patient not found
      security:
        - bearer: []
      summary: Manually adjust POD level for a patient (rollback only)
      tags:
        - Patients
  /patients/{id}:
    patch:
      description: >-
        The :id is the users.user_id of the patient account. Updates the
        patient_cases row and the linked account. Only provided fields are
        changed.
      operationId: PatientController_updatePatient
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePatientDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientListItemDto'
        '400':
          description: Invalid operation type or assigned nurse
        '404':
          description: Patient not found
        '409':
          description: Username already exists
      security:
        - bearer: []
      summary: Update a patient (case + linked login account)
      tags:
        - Patients
    delete:
      description: >-
        The :id is the users.user_id of the patient account. Marks the account
        and its linked patient_cases row as deleted (deleted_at). Clinical
        history is preserved and the records are excluded from all queries.
      operationId: PatientController_deletePatient
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: Patient soft-deleted
        '404':
          description: User not found
      security:
        - bearer: []
      summary: Soft-delete a patient by account user id (account + linked case)
      tags:
        - Patients
  /symptom-surveys/questions:
    get:
      operationId: SymptomSurveyController_getQuestions
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SurveyQuestionDto'
      security:
        - bearer: []
      summary: Get all survey questions with options
      tags:
        - Symptom Surveys
    post:
      operationId: SymptomSurveyController_createQuestion
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSurveyQuestionDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyQuestionDto'
      security:
        - bearer: []
      summary: Create a survey question with optional inline options (Head Nurse only)
      tags:
        - Symptom Surveys
  /symptom-surveys/questions/{questionId}:
    get:
      operationId: SymptomSurveyController_getQuestion
      parameters:
        - name: questionId
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyQuestionDto'
        '404':
          description: Question not found
      security:
        - bearer: []
      summary: Get a single survey question with its options
      tags:
        - Symptom Surveys
    patch:
      operationId: SymptomSurveyController_updateQuestion
      parameters:
        - name: questionId
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSurveyQuestionDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurveyQuestionDto'
        '404':
          description: Question not found
      security:
        - bearer: []
      summary: Update a survey question (Head Nurse only)
      tags:
        - Symptom Surveys
    delete:
      operationId: SymptomSurveyController_deleteQuestion
      parameters:
        - name: questionId
          required: true
          in: path
          schema:
            type: number
      responses:
        '204':
          description: ''
        '404':
          description: Question not found
        '409':
          description: Question already used in assessments
      security:
        - bearer: []
      summary: Delete a survey question and its options (Head Nurse only)
      tags:
        - Symptom Surveys
  /symptom-surveys/questions/{questionId}/options:
    post:
      operationId: SymptomSurveyController_addOption
      parameters:
        - name: questionId
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuestionOptionDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionOptionDto'
        '404':
          description: Question not found
      security:
        - bearer: []
      summary: Add an option to a question (Head Nurse only)
      tags:
        - Symptom Surveys
  /symptom-surveys/questions/{questionId}/options/{optionId}:
    patch:
      operationId: SymptomSurveyController_updateOption
      parameters:
        - name: questionId
          required: true
          in: path
          schema:
            type: number
        - name: optionId
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateQuestionOptionDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionOptionDto'
        '404':
          description: Option not found
      security:
        - bearer: []
      summary: Update a question option (Head Nurse only)
      tags:
        - Symptom Surveys
    delete:
      operationId: SymptomSurveyController_deleteOption
      parameters:
        - name: questionId
          required: true
          in: path
          schema:
            type: number
        - name: optionId
          required: true
          in: path
          schema:
            type: number
      responses:
        '204':
          description: ''
        '404':
          description: Option not found
        '409':
          description: Option already used in assessments
      security:
        - bearer: []
      summary: Delete a question option (Head Nurse only)
      tags:
        - Symptom Surveys
  /symptom-surveys:
    post:
      description: >-
        Submit answers for each question. BE calculates total_score from option
        score_values and assigns triage_color (GREEN 0-1, YELLOW 2-3, RED ≥4).
        Auto-generates alert if YELLOW or RED. Patient role can only submit for
        their own case_id.
      operationId: SymptomSurveyController_submit
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSymptomSurveyDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SymptomSurveyResponseDto'
        '400':
          description: Validation error or invalid option ID
        '403':
          description: Patient attempting to submit for another case
      security:
        - bearer: []
      summary: Submit a daily symptom survey
      tags:
        - Symptom Surveys
  /symptom-surveys/{patientId}/latest:
    get:
      description: Nurse/Admin can view any patient. Patient role can only view their own.
      operationId: SymptomSurveyController_getLatest
      parameters:
        - name: patientId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SymptomSurveyResponseDto'
        '403':
          description: Patient attempting to view another patient survey
        '404':
          description: No survey found for patient
      security:
        - bearer: []
      summary: Get latest survey for a patient
      tags:
        - Symptom Surveys
  /symptom-surveys/{surveyId}:
    get:
      description: >-
        Returns full answer breakdown and triage recommendation text. Patient
        role can only view their own surveys.
      operationId: SymptomSurveyController_getById
      parameters:
        - name: surveyId
          required: true
          in: path
          schema:
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SymptomSurveyResponseDto'
        '403':
          description: Patient attempting to view another patient survey
        '404':
          description: Survey not found
      security:
        - bearer: []
      summary: Get survey detail by ID
      tags:
        - Symptom Surveys
  /alerts:
    get:
      description: Filter by caseId, status, alertType. Supports page/limit pagination.
      operationId: AlertController_getAlerts
      parameters:
        - name: caseId
          required: false
          in: query
          description: Filter by patient case ID
          schema:
            example: CASE-001
            type: string
        - name: status
          required: false
          in: query
          description: Filter by alert status
          schema:
            type: string
            enum:
              - Pending
              - Acknowledged
              - Paused_POD
              - Rolled_Back
              - Escalated
              - Closed
        - name: alertType
          required: false
          in: query
          description: Filter by alert type
          schema:
            type: string
            enum:
              - YELLOW
              - RED
        - name: page
          required: false
          in: query
          description: 'Page number (default: 1)'
          schema:
            example: 1
            type: number
        - name: limit
          required: false
          in: query
          description: 'Items per page (default: 10)'
          schema:
            example: 10
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlertsDto'
      security:
        - bearer: []
      summary: Get alerts with filters and pagination
      tags:
        - Alerts
  /alerts/{id}/acknowledge:
    patch:
      description: Marks the alert as Acknowledged.
      operationId: AlertController_acknowledge
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcknowledgeAlertDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertResponseDto'
        '404':
          description: Alert not found
      security:
        - bearer: []
      summary: Acknowledge an alert
      tags:
        - Alerts
  /diet-guidance/operation-types:
    get:
      operationId: DietGuidanceController_getOperationTypes
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
