info:
  title: Capstone API
  description: Ride Sharing API
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    CreateUserDto:
      type: object
      properties:
        username:
          type: string
          example: user_hoa
          description: Unique login username
          maxLength: 50
        password:
          type: string
          example: Abc@12345
          description: Min 8 chars, at least 1 uppercase, 1 number, 1 special character
        fullName:
          type: string
          example: Nguyễn Thị Hoa
          maxLength: 100
        phoneNumber:
          type: string
          example: '0912345678'
          maxLength: 20
        roles:
          type: array
          example:
            - Nurse
          default:
            - Nurse
          items:
            type: string
            enum:
              - Admin
              - Head_Nurse
              - Nurse
              - Patient
      required:
        - username
        - password
        - fullName
    UserResponseDto:
      type: object
      properties:
        id:
          type: number
          example: 7
        username:
          type: string
          example: user_hoa
        fullName:
          type: string
          example: Nguyễn Thị Hoa
        phoneNumber:
          type: object
          example: '0912345678'
          nullable: true
        caseId:
          type: object
          example: CASE-001
          nullable: true
          description: Linked patient case ID (Patient role only)
        roles:
          example:
            - Nurse
          type: array
          items:
            type: string
        isActive:
          type: boolean
          example: true
        createdAt:
          format: date-time
          type: string
          example: '2024-06-15T08:00:00.000Z'
        updatedAt:
          format: date-time
          type: string
          example: '2024-06-15T08:00:00.000Z'
      required:
        - id
        - username
        - fullName
        - phoneNumber
        - roles
        - isActive
        - createdAt
        - updatedAt
    UpdateUserDto:
      type: object
      properties:
        username:
          type: string
          example: user_hoa_new
          maxLength: 50
        fullName:
          type: string
          example: Nguyễn Thị Hoa Mới
          maxLength: 100
        phoneNumber:
          type: string
          example: '0987654321'
          maxLength: 20
        password:
          type: string
          example: NewPass@99
        dob:
          type: string
          example: '1996-06-02'
        cityProvince:
          type: string
          example: Hà Nội
        ward:
          type: string
          example: Thanh Xuân
        detailedAddress:
          type: string
          example: Số 1 Nguyễn Trãi
        roles:
          type: array
          example:
            - Head_Nurse
          items:
            type: string
            enum:
              - Admin
              - Head_Nurse
              - Nurse
              - Patient
        isActive:
          type: boolean
          example: false
    LoginDto:
      type: object
      properties:
        username:
          type: string
          example: user_hoa
        password:
          type: string
          example: Abc@12345
      required:
        - username
        - password
    RefreshDto:
      type: object
      properties:
        refreshToken:
          type: string
          description: The refresh token issued at login
      required:
        - refreshToken
    NurseStatsDto:
      type: object
      properties:
        total:
          type: number
          example: 3
        active:
          type: number
          example: 2
        inactive:
          type: number
          example: 1
      required:
        - total
        - active
        - inactive
    NurseResponseDto:
      type: object
      properties:
        id:
          type: number
          example: 3
        username:
          type: string
          example: nurse01
        fullName:
          type: string
          example: Điều dưỡng 01
        phoneNumber:
          type: object
          example: '0912345678'
          nullable: true
        dob:
          type: object
          example: '1996-06-02'
          nullable: true
        cityProvince:
          type: object
          example: Hà Nội
          nullable: true
        ward:
          type: object
          example: Thanh Xuân
          nullable: true
        detailedAddress:
          type: object
          example: Số 1 Nguyễn Trãi
          nullable: true
        roles:
          example:
            - Nurse
